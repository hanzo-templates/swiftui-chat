# XcodeGen spec. The generated .xcodeproj is NOT checked in on purpose: a
# pbxproj is 700 lines of machine-written XML that conflicts on every branch and
# tells a reviewer nothing. This file is the project; run `xcodegen generate`.
name: HanzoChat
options:
  bundleIdPrefix: ai.hanzo
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true

targets:
  HanzoChat:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      # Generated by xcodegen, outside Sources/ so it is not compiled as a resource.
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Hanzo
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hanzo.swiftuichat
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Unsigned by default so `xcodebuild -sdk iphonesimulator` works with no
        # developer account. The archive workflow supplies a real identity.
        CODE_SIGNING_ALLOWED: NO

  HanzoChatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: HanzoChat }]
    settings:
      base: { SWIFT_VERSION: "6.0", CODE_SIGNING_ALLOWED: NO }

schemes:
  HanzoChat:
    build:
      targets: { HanzoChat: all, HanzoChatTests: [test] }
    test:
      targets: [HanzoChatTests]
